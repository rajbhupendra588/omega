[project]
name = "omega-qfm"
version = "0.1.0"
description = "Omega Quality Field Manifold — multi-physics code quality analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "tree-sitter>=0.22",
    "tree-sitter-java>=0.23",
    "tree-sitter-go>=0.23",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "httpx>=0.27.0",
]

[project.scripts]
omega = "omega.cli:main"
omega-ui = "omega.api.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["omega*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
